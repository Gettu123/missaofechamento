<script>
const C=[
["FASE 1 • RUBRICA","A diferença nasceu onde?","A Folha totalizou R
 
 1.217.450,00. Antes de corrigir valores, descubra onde a diferença nasceu.","Qual é a primeira trilha de investigação?",["Alterar o valor diretamente na conta contábil.","Rastrear rubrica → conta simbólica → determinação → conta contábil.","Reprocessar toda a folha imediatamente.","Excluir o documento contábil e gerar outro."],1,"A investigação começa na origem. Se a rubrica está correta, siga a determinação contábil até a conta do razão.","Não comece pela conta final. Volte uma camada: rubrica e determinação."],

["FASE 2 • DETERMINAÇÃO","A rubrica está certa. A conta não.","O valor da rubrica bate com a Folha, mas foi parar em uma conta diferente da esperada.","O que deve ser validado primeiro?",["Somente o nome da conta no FI.","Conta bancária do empregado.","Conta simbólica e regra de determinação contábil da rubrica.","Cadastro de endereço."],2,"A ponte entre Folha e FI passa pela conta simbólica e pela determinação contábil.","Pense na ponte entre Folha e FI."],
["FASE 3 • CENTRO DE CUSTO","O valor fecha. O centro não.","A despesa total está correta, mas R

["FASE 6 • COMPETÊNCIA","Competência diferente","Um valor aparece na Folha de setembro, mas a despesa gerencial foi analisada como se fosse de outubro. O pagamento ocorrerá em outra data.","Como organizar a análise?",["Misturar competência e pagamento.","Separar competência, provisão, realização e pagamento.","Considerar somente a data bancária.","Excluir o lançamento antigo."],1,"Uma conciliação robusta separa o momento econômico de provisão, realização e pagamento.","Pergunte: de que competência é o fato e quando ele foi pago?"],
["FASE 7 • TESOURARIA","O arquivo está certo... será?","A Folha fechou. O arquivo bancário está 

pronto, mas um beneficiário apresenta dados bancários divergentes.","Qual atitude evita que um erro vire pagamento?",["Enviar porque a Folha já fechou.","Bloquear o envio e validar banco, agência, conta, beneficiário e origem.","Corrigir o arquivo sem rastreabilidade.","Ignorar e conferir depois."],1,"Conciliação também é preventiva: uma divergência antes do envio pode evitar pagamento incorreto.","Fechamento da Folha não significa autorização automática para pagar."],
["FASE 8 • FECHAMENTO","A trilha completa","Chegou a hora do fechamento. Um valor precisa ser explicado de ponta a ponta, do cálculo até o reflexo financeiro.","Qual trilha representa uma conciliação completa?",["Rubrica → conta contábil e parar.","Rubrica → determinação → conta → centro/rateio → fornecedor/provisão → FI → 

pagamento.","Somente Folha → banco.","Somente conta contábil → fornecedor."],1,"A trilha completa conecta origem, regra, contabilidade, dimensão gerencial, obrigações e pagamento.","A pergunta-mestra é: de onde veio esse valor e onde deveria terminar?"]
];

let i=0,score=0,lives=3,streak=0,done=false,hinted=false;
const `$=x=>document.getElementById(x);

// LÓGICA DO VÍDEO
const video = document.getElementById('avatar-video');
const canvas = document.getElementById('video-canvas');
const ctx = canvas.getContext('2d', { 

willReadFrequently: true });
let videoState = 'IDLE';

const videoSegments = {
'IDLE': { start: 0.0, end: 5.0, loop: true },
 'SUCCESS': { start: 5.2, end: 7.0, loop: false },
'ERROR': { start: 7.5, end: 9.0, loop: false }
 };

function changeAvatarState(state) {
videoState = state;
video.currentTime = videoSegments[state].start;
video.play().catch(e => {
// Fallback se o navegador bloquear autoplay de vídeo
canvas.style.display = 'none';
$`("fallback-img").style.display = 'block';
});
}

video.addEventListener('timeupdate', () => {
const seg = videoSegments[videoState];
if (video.currentTime >= seg.end) {
if (seg.loop) {
video.currentTime = seg.start;
} else {
video.pause();
}
}
});

function renderVideoToCanvas() {
if (!video.paused && !video.ended) {
ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
let l = frame.data.length / 4;

for (let j = 0; j < l; j++) {

let r = frame.data[j * 4 + 0];
let g = frame.data[j * 4 + 1];
let b = frame.data[j * 4 + 2];
if (g > 90 && g > r * 1.2 && g > b * 1.2) {
frame.data[j * 4 + 3] = 0;
}
}
ctx.putImageData(frame, 0, 0);
}
requestAnimationFrame(renderVideoToCanvas);
}

video.addEventListener('play', () => {
`$("fallback-img").style.display = 'none';
canvas.style.display = 'block';
renderVideoToCanvas();
});

window.onload = () => {
video.load();

changeAvatarState('IDLE');
};

function render(){
let x=C[i];done=false;hinted=false;
 
("title").textContent=x[1];
 
("question").textContent=x[3];
 
("feedback").className="feedback";
 
("next").disabled=true;
 
("face").textContent="🤔";$`("react").textContent="Analise a trilha antes de responder.";

changeAvatarState('IDLE');

let box=`$("answers");box.innerHTML="";
x[4].forEach((t,n)=>{
let b=document.createElement("button");
b.className="answer";
b.innerHTML="<span class='letter'>"+String.fromCharCode(65+n)+"</span>"+t;
b.onclick=()=>answer(n);
box.appendChild(b)
});
stats()
}

function answer(n){
if(done)return;done=true;
let x=C[i],bs=document.querySelectorAll(".answer");
bs.forEach(b=>b.disabled=true);


if(n===x[5]){
bs[n].classList.add("correct");
let p=100+streak*15-(hinted?20:0);score+=Math.max(20,p);streak++;
 
("feedback").innerHTML="<b>✅ CORRETO!</b> "+x[6];
 
("react").innerHTML="<b>Boa!</b> Você encontrou a trilha certa.";
changeAvatarState('SUCCESS');
}else{
lives--;streak=0;
bs[n].classList.add("wrong");bs[x[5]].classList.add("correct");
 
("feedback").innerHTML="<b>❌ NÃO FECHA.</b> 

"+x[6];
 
("react").textContent="Volte para a origem do lançamento.";
changeAvatarState('ERROR');
}
 
("hint").disabled=true;stats();
if(lives<=0)setTimeout(()=>finish(true),500)
}

function stats(){
 
("lives").textContent="❤️".repeat(lives)+"🖤".repeat(3-lives);$`("streak").textContent=streak}

$("hint").onclick=()=&gt;{if(done||hinted||

score&lt;20)return;score-=20;hinted=true;$("feedback").className="feedback show";$("feedback").innerHTML="💡 &lt;b&gt;DICA:&lt;/b&gt; "+C[i][7];$("hint").disabled=true;stats()}
`$("next").onclick=()=>{if(i<C.length-1){i++;render()}else finish(false)}

function finish(lost){
 
("final").textContent=score+" pontos";
 
("modal").className="modal show"}
function restart(){
 
("reset").onclick=restart;


document.addEventListener("keydown",e=>{
let k=e.key.toLowerCase();
if("abcd".includes(k)&&!done){answer(k.charCodeAt(0)-97)}
if(e.key==="Enter"&&!
 
("next").click()
});
render();
